# =============================================================================
# Render Blueprint Configuration
# Single service: Flask serves BOTH the frontend UI and the backend API,
# so the whole app is available at ONE URL.
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  - type: web
    name: marketing-email-generator
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_NAME
        value: distilgpt2
      - key: MAX_NEW_TOKENS
        value: "250"
      - key: GENERATION_TIMEOUT_SECONDS
        value: "300"
      - key: MAX_REQUEST_BODY_BYTES
        value: "65536"
      # NOTE: Render injects the PORT variable automatically. Do not set it here.


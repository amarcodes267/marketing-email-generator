# =============================================================================
# Render Blueprint Configuration
# Deploys the Flask backend (API) and the static frontend as two services.
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API service (Flask + Gunicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: marketing-copy-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_NAME
        value: TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - key: MAX_NEW_TOKENS
        value: "500"
      - key: GENERATION_TIMEOUT_SECONDS
        value: "300"
      - key: MAX_REQUEST_BODY_BYTES
        value: "65536"
      # NOTE: Render injects the PORT variable automatically. Do not set it here.

  # ---------------------------------------------------------------------------
  # Frontend static site service
  # ---------------------------------------------------------------------------
  - type: web
    name: marketing-copy-frontend
    runtime: static
    rootDir: frontend
    region: oregon
    plan: free
    staticPublishPath: .
    # IMPORTANT: After the backend service is live, open frontend/js/config.js
    # and set window.MARKETING_AI_API_URL to your backend URL, e.g.
    #   window.MARKETING_AI_API_URL = 'https://marketing-copy-backend.onrender.com';
    # Then redeploy the frontend service.

